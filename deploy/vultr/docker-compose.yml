# Jweller API on the AIC Cloud VPS. Public port 80. Caddy keeps 443.
# API only — MongoDB is Atlas (MONGO_URL in .env).

services:
  api:
    container_name: jweller-api
    build:
      # On VPS: /opt/jweller/{backend,deploy}
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
    ports:
      - "80:8080"
    mem_limit: 512m
