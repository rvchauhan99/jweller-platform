name: Deploy API to Vultr

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/vultr/**"
      - ".github/workflows/deploy-vultr-api.yml"

concurrency:
  group: deploy-vultr-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${{ secrets.VULTR_HOST }}" ]; then
            echo "::error::GitHub secret VULTR_HOST is not set (VPS public IP 178.92.120.191)"
            missing=1
          fi
          if [ -z "${{ secrets.VULTR_SSH_USER }}" ]; then
            echo "::error::GitHub secret VULTR_SSH_USER is not set (e.g. root)"
            missing=1
          fi
          if [ -z "${{ secrets.VULTR_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::GitHub secret VULTR_SSH_PRIVATE_KEY is not set (full PEM private key)"
            missing=1
          fi
          exit "$missing"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}

      - name: Add Vultr host key
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          for attempt in 1 2 3; do
            if ssh-keyscan -T 15 -H "$VULTR_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
              echo "Host key added for $VULTR_HOST"
              exit 0
            fi
            echo "ssh-keyscan attempt $attempt failed, retrying..."
            sleep 3
          done
          echo "::error::Could not fetch SSH host key for $VULTR_HOST (port 22 reachable from GitHub?)"
          exit 1

      - name: Rsync backend
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          set -euo pipefail
          rsync -avz --delete \
            --exclude '__pycache__' \
            --exclude '.env' \
            --exclude 'tests' \
            --exclude '.pytest_cache' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            backend/ "${VULTR_SSH_USER}@${VULTR_HOST}:/opt/jweller/backend/"

      - name: Rsync deploy config
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        run: |
          set -euo pipefail
          rsync -avz \
            --exclude '.env' \
            -e "ssh -o StrictHostKeyChecking=yes" \
            deploy/vultr/ "${VULTR_SSH_USER}@${VULTR_HOST}:/opt/jweller/deploy/"

      - name: Build and restart API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: ${{ secrets.VULTR_SSH_USER }}
          key: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          script: bash /opt/jweller/deploy/deploy-remote.sh

      - name: Post-deploy smoke
        env:
          VULTR_HOST: ${{ secrets.VULTR_HOST }}
        run: |
          set -euo pipefail
          curl -sf "http://${VULTR_HOST}/api/" | grep -q '"status":"ok"'
          curl -sf -H "X-Tenant-Host: aurelia.luxejewel.app" \
            "http://${VULTR_HOST}/api/public/bootstrap" | grep -q '"tenant_code"'
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "X-Tenant-Host: aurelia.luxejewel.app" \
            "http://${VULTR_HOST}/api/public/savings/summary")
          if [ "$code" != "401" ]; then
            echo "Expected savings/summary to return 401 (auth required), got $code"
            exit 1
          fi
          echo "Smoke checks passed (savings route live: HTTP $code)"
